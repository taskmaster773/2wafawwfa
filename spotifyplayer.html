<!DOCTYPE html>
    <html>
    <head>
        <title>Music Player</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { 
                background: #121212; 
                color: #fff; 
                font-family: 'Helvetica Neue', Arial, sans-serif;
                height: 100vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            
            /* Header */
            .header {
                background: #1DB954;
                padding: 14px 24px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
            }
            .header h1 { font-size: 18px; color: #000; }
            
            /* Now Playing */
            .now-playing {
                text-align: center;
                padding: 20px;
                background: #1e1e1e;
                border-bottom: 1px solid #2a2a2a;
                flex-shrink: 0;
            }
            .now-playing h2 { color: #fff; font-size: 20px; margin-bottom: 4px; }
            .now-playing p { color: #b3b3b3; font-size: 14px; }
            
            /* Playlist */
            .playlist-container {
                flex: 1;
                overflow-y: auto;
                padding: 8px 12px;
            }
            .playlist-container::-webkit-scrollbar { width: 6px; }
            .playlist-container::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
            
            .playlist-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 14px;
                border-radius: 8px;
                cursor: pointer;
                transition: background 0.2s;
                margin-bottom: 2px;
            }
            .playlist-item:hover { background: #2a2a2a; }
            .playlist-item.active { background: #1DB954; }
            .playlist-item.active .title { color: #000; }
            .playlist-item.active .artist { color: #000; }
            
            .playlist-item .info { display: flex; flex-direction: column; flex: 1; }
            .playlist-item .title { color: #fff; font-size: 14px; font-weight: 500; }
            .playlist-item .artist { color: #b3b3b3; font-size: 12px; }
            .playlist-item .duration { color: #b3b3b3; font-size: 12px; }
            .playlist-item .play-icon { color: #1DB954; margin-right: 12px; font-size: 16px; }
            .playlist-item.active .play-icon { color: #000; }
            
            /* Controls */
            .controls {
                background: #181818;
                padding: 14px 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex-shrink: 0;
                border-top: 1px solid #282828;
            }
            .controls-top {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 24px;
            }
            .controls-top button {
                background: none;
                border: none;
                color: #b3b3b3;
                cursor: pointer;
                font-size: 18px;
                transition: color 0.2s;
                padding: 4px;
            }
            .controls-top button:hover { color: #fff; }
            .controls-top .play-pause {
                background: #1DB954;
                color: #000;
                width: 42px;
                height: 42px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
            }
            .controls-top .play-pause:hover { transform: scale(1.05); background: #1ed760; }
            
            .progress-container {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
            }
            .progress-container span { color: #b3b3b3; font-size: 11px; min-width: 36px; }
            .progress-bar {
                flex: 1;
                height: 4px;
                background: #535353;
                border-radius: 2px;
                cursor: pointer;
                position: relative;
            }
            .progress-fill {
                height: 100%;
                background: #1DB954;
                border-radius: 2px;
                width: 0%;
                transition: width 0.1s;
            }
            .progress-bar:hover .progress-fill { background: #1ed760; }
            
            /* Add Song Section */
            .add-song {
                padding: 10px 16px;
                background: #1a1a1a;
                border-top: 1px solid #2a2a2a;
                flex-shrink: 0;
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }
            .add-song input {
                flex: 1;
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #333;
                background: #2a2a2a;
                color: #fff;
                font-size: 13px;
                outline: none;
                min-width: 100px;
            }
            .add-song input:focus { border-color: #1DB954; }
            .add-song input::placeholder { color: #888; }
            .add-song button {
                padding: 8px 16px;
                border: none;
                border-radius: 6px;
                background: #1DB954;
                color: #000;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
                white-space: nowrap;
            }
            .add-song button:hover { background: #1ed760; }
            
            .no-songs { text-align: center; color: #888; padding: 40px 20px; font-size: 14px; }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>🎵 Music Player</h1>
        </div>
        
        <div class="now-playing">
            <h2 id="current-title">Select a song</h2>
            <p id="current-artist">or add your own MP3s below</p>
        </div>
        
        <div class="playlist-container">
            <div id="playlist"></div>
        </div>
        
        <div class="add-song">
            <input type="text" id="song-title" placeholder="Song title...">
            <input type="text" id="song-artist" placeholder="Artist...">
            <input type="text" id="song-url" placeholder="MP3 URL...">
            <button onclick="addSong()">+ Add</button>
        </div>
        
        <div class="controls">
            <div class="controls-top">
                <button onclick="prevSong()">⏮</button>
                <button class="play-pause" id="play-pause-btn" onclick="togglePlay()">▶</button>
                <button onclick="nextSong()">⏭</button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>
        
        <script>
            // ============================================
            // 🎵 ADD YOUR MP3s HERE - Edit this array!
            // ============================================
            let playlist = [
                // Example format:
                // {
                //     title: "East Coast",
                //     artist: "Alexgoffline",
                //     url: "https://cdn.jsdelivr.net/gh/taskmaster773/2wafawwfa@main/east%20coast.mp3"
                // }
            ];
            
            // ============================================
            // Player Logic (don't edit below unless you know what you're doing)
            // ============================================
            let currentIndex = 0;
            let isPlaying = false;
            let audio = new Audio();
            
            function renderPlaylist() {
                const container = document.getElementById('playlist');
                if (!playlist || playlist.length === 0) {
                    container.innerHTML = '<div class="no-songs">No songs in your playlist. Add some below!</div>';
                    return;
                }
                
                let html = '';
                playlist.forEach((song, index) => {
                    const isActive = index === currentIndex;
                    html += \`
                        <div class="playlist-item \${isActive ? 'active' : ''}" onclick="playSong(\${index})">
                            <div style="display:flex;align-items:center;flex:1;">
                                <span class="play-icon">\${isActive ? (isPlaying ? '▶' : '⏸') : '♫'}</span>
                                <div class="info">
                                    <span class="title">\${song.title || 'Untitled'}</span>
                                    <span class="artist">\${song.artist || 'Unknown Artist'}</span>
                                </div>
                            </div>
                            <span class="duration">\${song.duration || ''}</span>
                        </div>
                    \`;
                });
                container.innerHTML = html;
            }
            
            function playSong(index) {
                if (index < 0 || index >= playlist.length) return;
                currentIndex = index;
                const song = playlist[currentIndex];
                audio.src = song.url;
                audio.load();
                audio.play();
                isPlaying = true;
                updateUI();
                renderPlaylist();
            }
            
            function togglePlay() {
                if (!playlist || playlist.length === 0) return;
                if (audio.paused) {
                    audio.play();
                    isPlaying = true;
                } else {
                    audio.pause();
                    isPlaying = false;
                }
                updateUI();
                renderPlaylist();
            }
            
            function prevSong() {
                if (!playlist || playlist.length === 0) return;
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                playSong(currentIndex);
            }
            
            function nextSong() {
                if (!playlist || playlist.length === 0) return;
                currentIndex = (currentIndex + 1) % playlist.length;
                playSong(currentIndex);
            }
            
            function updateUI() {
                const song = playlist[currentIndex] || {};
                document.getElementById('current-title').textContent = song.title || 'No song selected';
                document.getElementById('current-artist').textContent = song.artist || '';
                document.getElementById('play-pause-btn').textContent = isPlaying ? '⏸' : '▶';
            }
            
            function updateProgress() {
                if (audio.duration) {
                    const progress = (audio.currentTime / audio.duration) * 100;
                    document.getElementById('progress-fill').style.width = progress + '%';
                    document.getElementById('current-time').textContent = formatTime(audio.currentTime);
                    document.getElementById('total-time').textContent = formatTime(audio.duration);
                }
            }
            
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + (secs < 10 ? '0' : '') + secs;
            }
            
            function seekTo(event) {
                const bar = document.getElementById('progress-bar');
                const rect = bar.getBoundingClientRect();
                const percent = (event.clientX - rect.left) / rect.width;
                if (audio.duration) {
                    audio.currentTime = percent * audio.duration;
                }
            }
            
            function addSong() {
                const title = document.getElementById('song-title').value.trim();
                const artist = document.getElementById('song-artist').value.trim();
                const url = document.getElementById('song-url').value.trim();
                
                if (!title || !url) {
                    alert('Please enter at least a title and MP3 URL!');
                    return;
                }
                
                playlist.push({ title, artist: artist || 'Unknown', url });
                document.getElementById('song-title').value = '';
                document.getElementById('song-artist').value = '';
                document.getElementById('song-url').value = '';
                
                if (playlist.length === 1) {
                    playSong(0);
                } else {
                    renderPlaylist();
                }
            }
            
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', nextSong);
            audio.addEventListener('play', () => { isPlaying = true; updateUI(); renderPlaylist(); });
            audio.addEventListener('pause', () => { isPlaying = false; updateUI(); renderPlaylist(); });
            
            // Load default songs if any
            if (playlist.length > 0) {
                playSong(0);
            } else {
                renderPlaylist();
            }
        </script>
    </body>
    </html>
